name: "Auto-Apply Indeed + Dice — Daily"

on:
  schedule:
    # Run 4 times per day during business hours (UTC → Mountain Time)
    - cron: "0 14 * * *"   # 8:00 AM MT — catch overnight postings
    - cron: "0 17 * * *"   # 11:00 AM MT — mid-morning batch
    - cron: "0 20 * * *"   # 2:00 PM MT — afternoon postings
    - cron: "0 23 * * *"   # 5:00 PM MT — end of day postings
  workflow_dispatch:
    inputs:
      max_apply:
        description: "Max applications per platform"
        default: "15"
      platform:
        description: "Platform to apply on (both, indeed, dice)"
        default: "both"

permissions:
  contents: write

jobs:
  apply-indeed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install firefox

      - name: Apply on Indeed
        if: ${{ github.event.inputs.platform != 'dice' }}
        continue-on-error: true
        env:
          INDEED_COOKIES: ${{ secrets.INDEED_COOKIES }}
          MAX_APPLY: ${{ github.event.inputs.max_apply || '15' }}
          HEADLESS: "1"
        run: cd scripts && python apply_indeed.py

      - name: Upload Indeed results
        uses: actions/upload-artifact@v4
        with:
          name: indeed-results-${{ github.run_number }}
          path: data/

      - name: Upload Indeed debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indeed-screenshots-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: ignore

      - name: Save applied jobs
        run: |
          git config user.email "bot@bobrikh.dev"
          git config user.name "Auto-Apply Bot"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: indeed applied $(date +%Y-%m-%d)"
          git push || true

  apply-dice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install firefox

      - name: Apply on Dice
        if: ${{ github.event.inputs.platform != 'indeed' }}
        continue-on-error: true
        env:
          DICE_COOKIES: ${{ secrets.DICE_COOKIES }}
          DICE_EMAIL: ${{ secrets.DICE_EMAIL }}
          DICE_PASSWORD: ${{ secrets.DICE_PASSWORD }}
          MAX_APPLY: ${{ github.event.inputs.max_apply || '15' }}
          HEADLESS: "1"
        run: cd scripts && python apply_dice.py

      - name: Upload Dice results
        uses: actions/upload-artifact@v4
        with:
          name: dice-results-${{ github.run_number }}
          path: data/

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dice-screenshots-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: ignore

      - name: Save applied jobs
        run: |
          git config user.email "bot@bobrikh.dev"
          git config user.name "Auto-Apply Bot"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: dice applied $(date +%Y-%m-%d)"
          git push || true

  send-report:
    runs-on: ubuntu-latest
    needs: [apply-indeed, apply-dice]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download Indeed results
        uses: actions/download-artifact@v4
        with:
          name: indeed-results-${{ github.run_number }}
          path: data/
        continue-on-error: true

      - name: Download Dice results
        uses: actions/download-artifact@v4
        with:
          name: dice-results-${{ github.run_number }}
          path: data/
        continue-on-error: true

      - name: Send email report
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
        run: python scripts/send_report.py
